# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-ruby
# https://github.com/ruby/setup-ruby

name: Test and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ['4.0', '3.4', '3.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: geckodriver --version
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby-version }}
      - name: Run rubocop
        run: bundle exec rubocop
      - name: Run Chromium tests
        run: bundle exec rspec
      - name: Run Firefox tests
        run: DRIVER=selenium_headless bundle exec rspec
      - name: Run rack_test tests
        run: DRIVER=rack_test bundle exec rspec
